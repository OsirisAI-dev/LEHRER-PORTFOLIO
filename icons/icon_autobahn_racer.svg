<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="55%" stop-color="#143a66"/>
      <stop offset="100%" stop-color="#0d1724"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b303a"/>
      <stop offset="100%" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="48%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fuelGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Circular Autobahn Backdrop -->
  <rect width="256" height="256" rx="128" fill="url(#bg)"/>
  <!-- German Flag Subtle Horizon Accent -->
  <rect x="0" y="0" width="256" height="10" fill="#111"/>
  <rect x="0" y="10" width="256" height="10" fill="#dd0000"/>
  <rect x="0" y="20" width="256" height="10" fill="#ffce00"/>
  <!-- Scenic Pine Silhouette Sides -->
  <circle cx="30" cy="70" r="22" fill="#14532d" opacity="0.85"/>
  <circle cx="24" cy="145" r="26" fill="#166534" opacity="0.85"/>
  <circle cx="228" cy="84" r="24" fill="#14532d" opacity="0.85"/>
  <circle cx="232" cy="164" r="25" fill="#166534" opacity="0.85"/>
  <!-- Top-Down Autobahn Road -->
  <rect x="54" y="0" width="148" height="256" fill="url(#road)"/>
  <rect x="54" y="0" width="6" height="256" fill="#e2e8f0"/>
  <rect x="196" y="0" width="6" height="256" fill="#e2e8f0"/>
  <!-- Dashed Lane Dividers -->
  <g fill="#f8fafc" opacity="0.85">
    <rect x="102" y="12" width="4" height="28" rx="2"/>
    <rect x="102" y="64" width="4" height="28" rx="2"/>
    <rect x="102" y="116" width="4" height="28" rx="2"/>
    <rect x="102" y="168" width="4" height="28" rx="2"/>
    <rect x="102" y="220" width="4" height="28" rx="2"/>
    <rect x="150" y="12" width="4" height="28" rx="2"/>
    <rect x="150" y="64" width="4" height="28" rx="2"/>
    <rect x="150" y="116" width="4" height="28" rx="2"/>
    <rect x="150" y="168" width="4" height="28" rx="2"/>
    <rect x="150" y="220" width="4" height="28" rx="2"/>
  </g>
  <!-- Fuel Tank Pickup Ahead (Center Lane) -->
  <g transform="translate(108, 42)">
    <rect x="0" y="6" width="40" height="36" rx="8" fill="url(#fuelGold)" stroke="#fff" stroke-width="2.5"/>
    <rect x="11" y="0" width="18" height="8" rx="3" fill="#ca8a04" stroke="#fff" stroke-width="1.5"/>
    <text x="20" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="16" fill="#111827">die</text>
  </g>
  <!-- Headlight Cones -->
  <polygon points="108,118 92,70 120,70" fill="#fef08a" opacity="0.22"/>
  <polygon points="148,118 136,70 164,70" fill="#fef08a" opacity="0.22"/>
  <!-- Top-Down German Sports Coupe -->
  <g transform="translate(98, 114)">
    <!-- Shadow -->
    <rect x="5" y="6" width="60" height="106" rx="18" fill="#000" opacity="0.45"/>
    <!-- Wheels -->
    <rect x="-4" y="16" width="8" height="22" rx="3" fill="#0f172a"/>
    <rect x="56" y="16" width="8" height="22" rx="3" fill="#0f172a"/>
    <rect x="-4" y="68" width="8" height="24" rx="3" fill="#0f172a"/>
    <rect x="56" y="68" width="8" height="24" rx="3" fill="#0f172a"/>
    <!-- Body -->
    <rect x="0" y="0" width="60" height="104" rx="20" fill="url(#carRed)" stroke="#fca5a5" stroke-width="1.5"/>
    <!-- Center Racing Hood Detail -->
    <rect x="26" y="4" width="8" height="96" fill="#ffffff" opacity="0.2"/>
    <!-- Headlights -->
    <ellipse cx="13" cy="11" rx="6" ry="7" fill="#fef9c3"/>
    <ellipse cx="47" cy="11" rx="6" ry="7" fill="#fef9c3"/>
    <!-- Windshield & Cabin -->
    <path d="M10,34 Q30,24 50,34 L46,56 Q30,52 14,56 Z" fill="url(#glass)"/>
    <rect x="13" y="54" width="34" height="22" rx="5" fill="#dc2626"/>
    <path d="M14,76 Q30,80 46,76 L49,88 Q30,93 11,88 Z" fill="url(#glass)" opacity="0.85"/>
    <!-- GT Rear Wing -->
    <rect x="4" y="92" width="52" height="7" rx="3" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1"/>
    <!-- Taillights -->
    <rect x="8" y="99" width="16" height="4" rx="2" fill="#ff2a2a"/>
    <rect x="36" y="99" width="16" height="4" rx="2" fill="#ff2a2a"/>
  </g>
</svg>
